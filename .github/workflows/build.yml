name: Build(lto) Kernel cmi KSU

on:
  workflow_dispatch:  # Manual trigger only

jobs:
  build:
    runs-on: ubuntu-latest  # Updated to newer Ubuntu version

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Update and Install Dependencies
        run: |
          sudo apt update && sudo apt install build-essential git curl wget bison flex zip bc cpio libssl-dev ccache lz4 gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi -y
# && sudo apt upgrade -y

      # LLVM-20 installation (commented out)
      # - name: Download and Install LLVM
      #   run: |
      #     wget https://apt.llvm.org/llvm.sh -O llvm.sh
      #     chmod +x llvm.sh
      #     sudo ./llvm.sh 20

      - name: Build Kernel
        run: |
          bash build_test.sh cmi ksu > out.txt
          [ -f out/.config ] && cp out/.config config.txt

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: |
            out.txt
            N0kernel_*
            config.txt