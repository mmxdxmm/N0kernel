name: Build Kernel with KernelSU-Next

on:
  workflow_dispatch:  # 仅允许手动触发工作流

jobs:
  build:
    runs-on: ubuntu-24.04  # 使用更新的 Ubuntu 版本

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup environment and install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git build-essential libssl-dev \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi \
            libncurses5-dev bzip2 curl bison flex \
            openssl lzop unzip zlib1g-dev file ca-certificates \
            ccache wget texinfo xz-utils libelf-dev zip \
            libgmp-dev libncurses-dev gawk m4 cpio \
            binutils-dev cmake ninja-build u-boot-tools \
            python3 python3-pip zstd clang llvm lld \
            libstdc++-12-dev crossbuild-essential-arm64 \
            lz4

      - name: Install specific LLVM version
        run: |
          wget https://apt.llvm.org/llvm.sh -O /tmp/llvm.sh
          chmod +x /tmp/llvm.sh
          sudo /tmp/llvm.sh 20 all
          sudo update-alternatives --install /usr/bin/clang clang /usr/bin/clang-20 20
          sudo update-alternatives --install /usr/bin/llvm-config llvm-config /usr/bin/llvm-config-20 20

      - name: Setup CCache
        run: |
          echo "CCACHE_DIR=$HOME/.ccache" >> $GITHUB_ENV
          echo "CCACHE_COMPRESS=1" >> $GITHUB_ENV
          echo "CCACHE_MAXSIZE=2G" >> $GITHUB_ENV
          ccache --show-stats

      - name: Build Kernel
        run: |
          # 确保构建脚本有执行权限
          chmod +x build.sh
          # 运行并把输出保存到文件
          bash build.sh cmi ksu > out.txt
          # 复制配置文件
          [ -f out/.config ] && cp out/.config config.txt 
          cp out/arch/arm64/boot/Image* ./

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kernel-build-artifacts
          path: |
            out.txt
            config.txt
            N0kernel_*
            image*
