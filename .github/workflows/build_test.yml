name: Build test

on:
  workflow_dispatch:  # Manual trigger only

jobs:
  build:
    runs-on: ubuntu-latest  # Updated to newer Ubuntu version

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Update and Install Dependencies
        run: |
          sudo apt update && sudo apt install build-essential git curl wget bison flex zip bc cpio libssl-dev ccache lz4 gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi -y
# && sudo apt upgrade -y

      # LLVM-20 installation (commented out)
      # - name: Download and Install LLVM
      #   run: |
      #     wget https://apt.llvm.org/llvm.sh -O llvm.sh
      #     chmod +x llvm.sh
      #     sudo ./llvm.sh 20

      - name: Install Python 2.7 from source
        run: |
          sudo apt update
          wget https://www.python.org/ftp/python/2.7.18/Python-2.7.18.tar.xz
          tar -xf Python-2.7.18.tar.xz
          cd Python-2.7.18
          ./configure --enable-optimizations
          make -j$(nproc)
          sudo make altinstall  # 安装为 python2.7，不覆盖系统 python3
          sudo ln -sf /usr/local/bin/python2.7 /usr/bin/python2
          cd .. && rm -rf Python-2.7.18*
      
      - name: Build Kernel
        run: |
          bash build_test.sh cmi ksu > out.txt
          [ -f out/.config ] && cp out/.config config.txt

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: |
            out.txt
            N0kernel_*
            config.txt
