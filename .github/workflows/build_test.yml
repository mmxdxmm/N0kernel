name: Build test

on:
  workflow_dispatch:  # 仅手动触发

jobs:
  build:
    runs-on: ubuntu-24.04  # 使用最新的 Ubuntu LTS 版本

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            build-essential git curl wget bison flex zip bc cpio \
            libssl-dev ccache lz4 gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi
        # 移除了 sudo apt upgrade，避免不必要的系统更新

      # LLVM-20 安装（注释保留，可按需启用）
      # - name: Download and Install LLVM
      #   run: |
      #     wget https://apt.llvm.org/llvm.sh -O llvm.sh
      #     chmod +x llvm.sh
      #     sudo ./llvm.sh 20

      - name: Build Kernel
        run: |
          bash build_test.sh cmi ksu > out.txt
          [ -f out/.config ] && cp out/.config config.txt

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: |
            out.txt
            N0kernel_*
            config.txt
          if-no-files-found: ignore  # 避免因文件缺失导致步骤失败
